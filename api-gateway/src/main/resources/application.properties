spring.application.name=api-gateway
server.port=8765


#Bu sunucuya bilgilerini kaydetmesi için yaziliyor...
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

eureka.instance.prefer-ip-address=true

#Uygulamanizda bir DiscoveryClient (örn. Eureka client) varsa, Gateway kayit defterindeki servisleri okur. Her servis için bir route olusturur.
#Spring Cloud Gatewayin servis kesif sistemi (Eureka/Consul vb.) üzerinden kayitli servisleri otomatik olarak routera dönüstürmesini saglar.
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

#eurokadan aldigi serverlari kucuk harfle cagirabilmek icin yazildi...
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

#Tracing isleminin ne kadarini takip etmek istiyoruz. (1 = 100, 0.05 = %5 ini gibi...)
management.tracing.sampling.probability=1.0

#log'un nasil gözükmesini istiyoruz...
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]